<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nathan Blaker</title>
<meta name="description" content="Nathan Blaker">
<style>
  :root { --bg:#faf9f6; --fg:#1c1c1c; --muted:#6b6b6b; --line:#e4e1da; --accent:#2f5d50; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --fg:#ededed; --muted:#9a9a9a; --line:#2a2a2a; --accent:#8cc5b3; }
  }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--fg);
    font:17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  main { max-width:520px; width:100%; }
  h1 { font-size:clamp(2.2rem, 8vw, 3.2rem); font-weight:650; letter-spacing:-0.03em; line-height:1.1; }
  p { color:var(--muted); margin-top:12px; }
  nav { margin-top:28px; padding-top:20px; border-top:1px solid var(--line); display:flex; gap:20px; flex-wrap:wrap; }
  a { color:var(--accent); text-decoration:none; font-weight:500; }
  a:hover { text-decoration:underline; }
</style>
</head>
<body>
<main>
  <h1>Nathan Blaker</h1>
  <nav>
    <a href="https://www.linkedin.com/in/nathanblaker/">LinkedIn</a>
  </nav>
</main>
</body>
</html>
